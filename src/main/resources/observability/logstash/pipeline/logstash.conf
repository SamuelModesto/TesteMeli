input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # @timestamp já vem preenchido pelo LogstashEncoder — garante parse correto
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Remove campos internos do Logstash que não agregam valor
  mutate {
    remove_field => ["event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ml-product-api-%{+YYYY.MM.dd}"
  }
}